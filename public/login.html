<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Innoweb Jarvis</title>
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #f1f5f9; font: 16px/1.5 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(900px 700px at 85% -10%, rgba(37, 99, 235, 0.35), rgba(37, 99, 235, 0) 70%), radial-gradient(900px 700px at 100% 110%, rgba(234, 88, 12, 0.22), rgba(234, 88, 12, 0) 68%), #05070d; }
  form { width: 100%; max-width: 360px; padding: 32px 28px; margin: 16px; border-radius: 22px; background: linear-gradient(145deg, rgba(255, 255, 255, 0.11), rgba(255, 255, 255, 0.03)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 30px 70px rgba(0, 0, 0, 0.5); }
  svg { width: 40px; height: 40px; color: #93c5fd; }
  h1 { margin: 10px 0 4px; font-size: 24px; }
  p { margin: 0 0 20px; color: #94a3b8; }
  input { width: 100%; box-sizing: border-box; padding: 14px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 18px; font-weight: 600; }
  button { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); color: #fff; font-size: 17px; font-weight: 700; }
  #msg { min-height: 1.5em; margin-top: 10px; color: #f87171; font-size: 14px; }
</style>
</head>
<body>
<form id="f">
  <svg viewBox="-30 -30 60 60" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><polygon points="24,0 12,-20.8 -12,-20.8 -24,0 -12,20.8 12,20.8"/><polygon points="10,0 5,-8.7 -5,-8.7 -10,0 -5,8.7 5,8.7"/><path d="M10,0L24,0M5,-8.7L12,-20.8M-5,-8.7L-12,-20.8M-10,0L-24,0M-5,8.7L-12,20.8M5,8.7L12,20.8"/></g></svg>
  <h1>Innoweb Jarvis</h1>
  <p>Enter the password to open the dashboard.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <button type="submit">Open Jarvis</button>
  <div id="msg"></div>
</form>
<script>
  // XMLHttpRequest, not fetch: the TV's browser (Chrome 56) drops the login
  // cookie from a fetch reply, which sent it straight back here.
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var x = new XMLHttpRequest();
    x.open('POST', '/api/login');
    x.withCredentials = true;
    x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function () {
      if (x.status === 200) {
        var m = /[?&]next=([^&]*)/.exec(location.search);
        location.href = m ? decodeURIComponent(m[1]) : '/';
      } else document.getElementById('msg').textContent = 'That password is not right.';
    };
    x.onerror = function () { document.getElementById('msg').textContent = 'Could not reach Jarvis. Try again.'; };
    x.send(JSON.stringify({ password: document.getElementById('pw').value }));
  };
</script>
</body>
</html>
